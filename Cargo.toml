[package]
name = "thrall"
version = "0.0.2"
edition = "2024"
description = "thrall: the foot — a tool-execution client for a yog server"
license = "MIT"
readme = "README.md"
# The source of the published crate, and it is named here because a VERSION's
# metadata is frozen at publication — every version carries its own copy, and
# 0.0.1 was the first chance the published thrall got to carry a link back at
# all. `cargo package` warns when a
# manifest names no documentation, homepage or repository, and that warning was
# standing. The repository is public (bl-006e's remote half), so naming it
# discloses nothing that is not already served from it.
repository = "https://github.com/mudbungie/thrall"

# PUBLISHED, as of bl-006e's second half (bl-d2be). The flag was `false` from
# the founding and the flag WAS the enforcement — the decision of whether, when
# and as what thrall first ships was an operator's and had not been made. It has
# now been made and 0.0.1 was published by hand with a registry token, from a
# `main` that had passed the publication checklist in full.
#
# What the flip does NOT do, and the distinction is the whole of why `true` is
# safe here. It does not make a publication automatic: this repository's release
# workflow has no automatic trigger and a first job that refuses outright, and
# arming it is a separate, severable operator act. It does not make a
# publication cheap either — `cargo publish` stays irreversible, and a yanked
# version stays downloadable — but the irreversibility left is now per VERSION
# rather than per CRATE, and the two things that guard a version's CONTENT are
# below and beside: the `include` allowlist, and `src/packaged_tests.rs`, which
# reads the real `cargo package --list` on every gate run and fails on anything
# no class rules in.
#
# The registry name is no longer a placeholder to protect; it is this crate.
publish = true

# WHAT `cargo publish` MAY UPLOAD, as an ALLOWLIST (bl-d25a, prep for bl-006e).
#
# An allowlist and never an `exclude`, because the two failure modes are not
# symmetric: a missing `include` entry costs a BUILD, which is loud and
# reversible, while a missing `exclude` entry costs a PUBLICATION that cannot
# be recalled — a yanked version stays downloadable. So the list fails closed,
# and `src/packaged_tests.rs` pays that cost's one bill (a compile input that
# is not a `.rs` file under `src` must be ruled in here before it can ship).
#
# Declaring nothing packages the WHOLE TREE, which is the defect this closes:
# without these four lines `cargo package` ships the agent guide, the design
# document, every rule and hook, and `scripts/leak-fixtures/` — a corpus of
# deliberately fabricated secrets — alongside the binary.
#
# EVERY PATTERN IS ANCHORED with a leading `/`. Cargo matches these
# gitignore-style, so a bare `README.md` means "a README.md at any depth" and
# would ship `scripts/leak-fixtures/README.md` out of a list that names no
# `scripts` entry. That is not hypothetical; it is upstream's sighting.
#
# `Cargo.toml` and `Cargo.lock` are added by cargo itself and need no entry.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE",
]

# A dependency lands here with the ball that first LINKS it, never before: a
# dependency added "for later" is one nobody ever reviewed, because it is
# linked by no code and so no gate and no reviewer ever reads it.
#
# LINKED SO FAR: `rustls` and `serde_json`, both by bl-a4a5 (the mTLS channel).
# `thiserror` is approved and still absent — every refusal on this surface is
# one `String` a caller prints, so there is no error enum for it to derive yet.
#
# THIS COMMENT IS THE APPROVED SET (bl-e5ba, operator ruling 2026-08-29). The
# house rule is "zero new dependencies without explicit approval"; the
# adjudication has now happened, so what follows is the authority for what may
# be added and on exactly what terms. A crate not on this list still needs a
# fresh approval. Each approved crate lands in this table with the ball that
# first LINKS it, never before:
#
#   rustls — `default-features = false`, features `ring`, `std`, `tls12`,
#     `logging`. The wire is mTLS (bl-a4a5) and nothing else may provide it.
#     `default-features = false` is load-bearing, not tidiness: rustls' default
#     features select `aws-lc-rs`, whose `aws-lc-sys` builds C and breaks the
#     single-binary story that is most of why a foot is easy to install on a
#     box nobody administers for you. `ring` is the approved provider and the
#     one substitution that is NOT at the linking ball's discretion.
#   serde_json — the wire is JSON, and a tool's `input_schema` is JSON Schema
#     carried verbatim (bl-05fe). Hand-rolling a parser for a security boundary
#     is worse than a dependency.
#   thiserror — the error enums, house standard rule 10. Its companion half,
#     `anyhow`, is NOT approved: thrall's `main.rs` is a thin entry with no
#     error-plumbing layer that would justify one.
#
# DEFERRED, which is not the same as refused:
#   clap — only if the verb surface outgrows a hand-rolled argv match. The
#     skeleton's `src/cli.rs` does not, and the client's may not either. It is
#     re-adjudicated by whichever ball first wants it, and the question that
#     ball must answer is whether the match arms actually stopped fitting.
#
# REFUSED, and both are refusals of a whole direction rather than of a crate:
#   tokio — the wire is synchronous. House rule 8 (async is tokio-only) stays
#     VACUOUS here; do not add tokio to satisfy a rule that matches nothing.
#   rcgen — certificates arrive out of channel by the operator's hand
#     (REMOTE §1.4, DESIGN §3.3). thrall mints nothing, so a certificate
#     library is a capability the design says this component must not have.
#
# `deny.toml` bans the TLS stacks that must never arrive (openssl-sys,
# native-tls, aws-lc-sys), so a manifest edit that quietly widened this
# approval — dropping `default-features = false`, most of all — fails the gate
# instead of silently re-acquiring a C toolchain. The bans are armed now,
# before any of the above exists.
[dependencies]
# The wire is mTLS and nothing else may provide it (bl-a4a5). The three feature
# terms are the approval's, not this ball's: `default-features = false` because
# rustls' defaults select `aws-lc-rs`, whose sys crate builds C and breaks the
# single-binary story; `ring` because it is the approved provider and the one
# substitution that is not at a linking ball's discretion; `std` and `tls12`
# because the channel is synchronous `std::net` and the engine's safe default
# protocol versions include TLS 1.2. `deny.toml` bans `aws-lc-sys` outright, so
# an edit that dropped the flag fails the gate rather than quietly re-acquiring
# a C toolchain.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# The wire is JSON: a frame is a JSON value, a capture is a JSON object, and a
# tool's `input_schema` is JSON Schema carried verbatim. Hand-rolling a parser
# for a security boundary is worse than a dependency.
serde_json = "1"

[[bin]]
name = "thrall"
path = "src/main.rs"

# rustc lint gate: the toolchain is pinned (rust-toolchain.toml), so any warning
# is a deliberate event, not toolchain drift — deny the lot.
[lints.rust]
warnings = "deny"

# Clippy gate. `pedantic` runs at deny with priority -1 so the specific
# allows/denies below (default priority 0) override the group. THIS MANIFEST IS
# THE ONLY HOME FOR A SUPPRESSION — never inline an `#[allow]` to dodge it
# (rules/no-lint-suppression.yml forbids it). Every entry carries its reason.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }

# The bootstrap five: owned signatures and self-describing errors are house
# style, and the doc/must_use nags are advisory only.
needless_pass_by_value = "allow"   # owned params are a deliberate rule, not an oversight
module_name_repetitions = "allow"  # module-qualified type names read clearer than terse ones
missing_errors_doc = "allow"       # error enums are self-descriptive; no prose to duplicate
missing_panics_doc = "allow"       # prod is panic-free (restriction lints below) — nothing to note
must_use_candidate = "allow"       # advisory; not decorating every getter with #[must_use]

# Empirically warranted here: the prose is proper-noun dominated (thrall, yog,
# lernie, mTLS, MCP) and the nag is noise on every doc comment in the crate.
doc_markdown = "allow"

# Restriction lints: prod code is panic-free and bounds-checked. These deny the
# panic family, leftover `dbg!`, and unchecked indexing/string slicing.
# `clippy --all-targets -- -D warnings` (the gate) picks them up; the test
# carve-outs live in clippy.toml (allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
