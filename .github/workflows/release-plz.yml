name: Release-plz

# **The release path, ARMED** (bl-bbb3; shape laid down by bl-d25a, adjudicated
# by bl-006e, first version published by hand in bl-d2be). Build-gated and
# hands-off: a push to `main` runs the gate, keeps the release PR fresh, and
# releases any version in the manifest the registry does not already serve.
#
# WHAT ARMING CHANGED, and it is three edits. The trigger gained `push:
# branches: [main]`; the `refuse` job that stood where the build gate goes was
# REPLACED by the gate itself — `ci`, the whole CI workflow executed inside this
# run; and `needs: refuse` on the release job became `needs: ci`. That ordering
# was the point of writing the disarm as a job rather than a comment: the edit
# that arms this pipeline is the edit that gives it a gate, and neither could be
# done without the other.
#
# THE FILENAME IS NOT A PREFERENCE. Publishing here is TRUSTED PUBLISHING — the
# model that replaces a stored registry token. Instead of keeping a long-lived
# secret in this repository, crates.io records that ONE named workflow file in
# ONE named GitHub repository may publish ONE named crate; at run time GitHub
# mints a short-lived signed OIDC token asserting exactly that identity (repo,
# workflow, ref), and release-plz trades it for a ~30-minute registry token
# scoped to this crate. The workflow FILENAME is matched literally against that
# claim, so RENAMING THIS FILE BREAKS PUBLISHING until the registry entry is
# updated to match. `id-token: write` on the release job is the whole grant and
# it exists on that job alone. No `CARGO_REGISTRY_TOKEN` is set here and none
# should be — release-plz performs the exchange itself, so
# `rust-lang/crates-io-auth-action` must NOT also be added.
#
# Trusted publishing cannot CREATE a crate, only publish a further version of
# one that exists. That is why registration could not have happened earlier and
# why this workflow arrived after 0.0.1 rather than with it: 0.0.1 was bl-d2be's
# hand-run act, with a registry token, from a `main` that had passed the
# publication checklist in full. Registering the publisher is also what RETIRES
# that token path — no long-lived registry credential is stored in this
# repository and none should be.
#
# THE JOBS, and what each is for.
#
#   * ci — the whole CI workflow, executed HERE via
#     `uses: ./.github/workflows/ci.yml` (a `workflow_call`), never observed
#     from a distance. That placement is the one detail most likely to be
#     "simplified" into a bug: crates.io REFUSES an OIDC token minted under a
#     `workflow_run` trigger, so gating the release on an OBSERVED CI run
#     publishes nothing, quietly, forever. A called workflow runs inside THIS
#     run, which keeps the claim at trigger=push / workflow `release-plz.yml`
#     while the release job still hard-gates on it through `needs:`. `ci.yml`
#     has no push arm of its own, so a push to `main` runs the gate exactly
#     once — here.
#   * release-plz PR (push to `main` only) — opens or refreshes ONE "release PR"
#     that bumps the version in `Cargo.toml`/`Cargo.lock` and nothing else
#     (`changelog_update = false` in `release-plz.toml`, with the reason). It
#     never publishes; `merge-release-pr` below merges it. It does not wait on
#     `ci` — it touches nothing the gate protects, and a red tree should still
#     be able to see what the next version would be.
#   * release (`needs: ci`) — releases any manifest version the registry does
#     not serve: tags it `v<version>` (`release-plz.toml`'s `git_tag_name`),
#     cuts a GitHub Release, and publishes to crates.io. Behind the gate, so a
#     release only ever ships a GREEN tree — a release pipeline that could ship
#     an untested commit is worse than no release pipeline at all.
#   * merge-release-pr (`needs: ci, release-plz-pr, release-plz-release`) —
#     merges the release PR this run just refreshed, then dispatches this
#     workflow again so the merged bump is the one that publishes. Its whole
#     derivation is the section headed AUTO-MERGE below; neither sibling
#     repository's mechanism works here.
#   * prune-release-branches (right after the PR job) — deletes every
#     `release-plz-*` branch with no open PR. release-plz pushes a NEW
#     timestamped branch each time it refreshes the release PR, and pushes it
#     BEFORE opening the PR, so superseded and orphaned branches pile up one per
#     push to `main`; the repository's "automatically delete head branches"
#     setting only fires on MERGE and never sees them. It runs when that job
#     FAILED as well as when it succeeded, because the branch is pushed before
#     the PR is opened and a failure there is precisely how a branch is left
#     with nothing to close it — see the job's own condition.
#
# So the flow is: land work on `main` -> the gate runs and the release PR is
# kept fresh; merge the release PR -> the gate runs again -> on green the new
# version is tagged, released and published.
#
# ONE-TIME SETUP THAT IS NOT IN THIS TREE, and no edit here can perform any of
# it. Until the first two are done this workflow fails loudly rather than
# quietly, which is the correct direction:
#   * The crates.io TRUSTED PUBLISHER for the `thrall` crate — owner
#     `mudbungie`, repository `thrall`, workflow filename `release-plz.yml`,
#     environment empty. Without it the release job's publish step is refused by
#     the registry.
#   * Settings -> Actions -> General -> "Allow GitHub Actions to create and
#     approve pull requests" — without it the release-PR job 403s. Same page:
#     Workflow permissions set to "Read and write permissions"; a sibling
#     repository's fresh-repo read-only default let a publish succeed and then
#     403 on creating the tag, despite this file's own job-level
#     `contents: write`. `cargo publish` is irreversible, so verify that BEFORE
#     merging a release PR, not after.
#   * RELEASE_PLZ_TOKEN is OPTIONAL — a fine-grained PAT (contents +
#     pull-requests write) so the release PR's own commits re-trigger CI, which
#     the default token cannot do for its own pushes. The PR job falls back to
#     `GITHUB_TOKEN` when it is unset.
#
# NOT HERE, deliberately, and each is somebody else's ball.
#   * No upload job for the Linux release binary or for `make mac-artifact`'s
#     aarch64-apple-darwin build, though both artifacts now exist and are
#     reproducible from a clean checkout — attaching them is a job, not a design
#     question.
#   * No image push. The Makefile names the registry
#     (`ghcr.io/mudbungie/thrall`, one immutable version tag and one digest,
#     never a moving `latest`) and says a push lives in a release workflow at
#     tag time, which is this file once there is a release to tag.

# ---------------------------------------------------------------------------
# AUTO-MERGE, AND WHY IT IS A JOB IN THIS FILE (bl-ce54)
#
# Merging the release PR used to be the human control point. It is not one any
# more (operator ruling 2026-09-03): the decision it asks for was already made
# by the work that landed on `main`, and the publish is gated AFTER the merge
# by `release-plz-release`'s own `needs: ci`, so a red tree bumps a version on
# `main` and ships nothing. Holding the PR open bought nothing and cost every
# release a hand — 0.0.4's PR sat open for a day.
#
# Both sibling repositories carry a mechanism now and NEITHER transplants here,
# because both hang off a trigger this repository does not have.
#
#   * yog merges from a SEPARATE workflow woken by a `workflow_run` on its CI,
#     with a fine-grained PAT, and needs no post-merge dispatch because that
#     PAT's push re-triggers everything. Copying it here would need a PAT this
#     repository does not have, and a `workflow_run` arm this file's trigger
#     comment refuses on the crates.io-OIDC grounds stated above.
#   * lernie wakes on ITS release workflow completing, because its release job
#     is gated by observing CI from a distance. Here the gate is `needs: ci`
#     INSIDE this run — so the thing lernie has to observe is a job this file
#     can simply depend on. A second workflow to watch this one finish would be
#     a `workflow_run` arm bought for nothing.
#
# So the mechanism is a job, and `needs:` is the whole of its wiring.
#
# WHAT "GREEN" MEANS HERE — this run's own `ci` job, reached through `needs:`.
# That is the exact job `release-plz-release` gates on, so the merge gate and
# the publish gate cannot disagree, and it is deliberately NOT the release
# PR's own checks: THOSE NEVER RUN IN THIS REPOSITORY. Every `pull_request` CI
# run on a `release-plz-*` head here has been created in `action_required` and
# has never started a single job — three of them across the two release PRs
# this repository has had, the last created a full day before its PR was merged
# by hand and still unrun at that moment. A merge gated on the PR's own checks,
# or on its check rollup, would therefore merge nothing, forever.
#
# `ci` judges THIS run's commit, and the release PR is a bump on top of exactly
# that commit: release-plz rebases the release branch onto `main` on every push
# here, so the PR head's first parent is `github.sha` (checked on both release
# PRs this repository has had). The job gates on that identity rather than
# assuming it, so what it merges can only ever be the tree `ci` just passed
# plus the version bump.
#
# WHICH TOKEN MERGES, AND WHY THE DISPATCH IS NOT OPTIONAL. `GITHUB_TOKEN`,
# because there is no other token here. That makes the merge's push to `main`
# fire NOTHING — GitHub, verbatim: "with the exception of `workflow_dispatch`
# and `repository_dispatch`, other GITHUB_TOKEN triggered events do not create
# workflow runs" — so a merge on its own would leave the bump on `main`,
# unpublished, until some unrelated push happened by. The same sentence names
# the way out, and the job takes it: after the merge it dispatches THIS
# workflow on `main`. That is not a second door into the release path.
# `workflow_dispatch` is already one of this file's two triggers, the release
# job's `needs: ci` does not vary by trigger, and the dispatched run therefore
# re-runs the whole gate on the merged tree before publishing anything.
#
# The dispatched run cannot re-enter this job: `release-plz-pr` is push-only,
# so on a dispatch it is SKIPPED and every `needs:` of it skips with it. There
# is no loop to bound because there is no second merge to make.
#
# The dependency on `release-plz-release` is not ordering decoration either.
# That job checks out the `main` BRANCH rather than this run's sha, so a merge
# landing while it runs would hand it a tree nothing gated. Merging strictly
# after it removes the race: this run publishes whatever `main` already owed,
# then the merge lands the bump, then the dispatched run publishes that.
#
# THE GUARDS. yog rejects an author guard because its PAT makes release PRs
# indistinguishable from a human's; here the fallback token opens them, so the
# author IS a usable signal and is used. Five stand, and none is the check
# rollup:
#
#   1. The head branch is release-plz's own timestamped shape, anchored end to
#      end — `release-plz-YYYY-MM-DDTHH-MM-SSZ`. A branch merely STARTING with
#      the prefix does not pass.
#   2. The author is the Actions bot (the `GITHUB_TOKEN` fallback's identity,
#      which is what opens every release PR here) or the repository owner (a
#      PAT's identity, so the guard survives one being added later).
#   3. Every changed file is `Cargo.toml` or `Cargo.lock`, and there is at
#      least one. That is what a release PR IS here — `release-plz.toml` sets
#      `changelog_update = false`, so a `CHANGELOG.md` in one would mean that
#      decision moved and this guard should be re-derived rather than widened.
#      It is a structural test no human pull request passes by accident.
#   4. Not a draft, and GitHub says `MERGEABLE`.
#   5. The head commit's first parent is this run's commit — the tree `ci`
#      passed, as above.
#
# A verdict line is printed for EVERY open pull request on EVERY run, passing
# or not: a mechanism that merges silently is one nobody can audit, and the run
# log is the only record it keeps. It writes nothing into any pull request body
# or comment — there is nothing worth saying there that the log does not say,
# and a body cannot be un-published.
#
# It merges with `--delete-branch` rather than leaving the head to
# `prune-release-branches`. The dispatched run skips that job with the rest of
# the push-only chain, so the branch would otherwise wait for an unrelated push
# to `main` to be collected. Prune stays the collector for the branches nothing
# merged.

# No `workflow_run` arm anywhere — see the `ci` job. The gate is `needs: ci`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read by default; each job that writes says so and says why. Job-level
# `permissions` REPLACE this block rather than adding to it. Every third-party
# action is pinned to a full commit SHA with its tag in the trailing comment: a
# tag is mutable — its owner can repoint `v0.5` at new code between two runs —
# and this workflow is the one that holds publishing authority.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    # Owner guard: never runs in a fork. Safe against fork-PR abuse because
    # neither trigger is reachable from a fork — a fork PR fires `pull_request`,
    # which is not requested here, and never a push to this `main` or a dispatch
    # on it, both of which need write access upstream.
    if: github.repository_owner == 'mudbungie'
    # Job-level permissions on a `uses:` job set the ceiling for every job in
    # the called workflow. CI reads the tree and writes nothing back.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # Owner guard: never runs in a fork. Only a direct push to main maintains
    # the release PR — a dispatch is for releasing, not for refreshing a PR.
    if: github.repository_owner == 'mudbungie' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    # Never two release-PR updates at once: they would race on the branch.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release-plz reads the whole history to decide the next version.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          # The SHA pin erases the ref name this action reads the toolchain
          # from, so name it; rust-toolchain.toml still pins the build version.
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          # No registry credential here: this job only opens the release PR.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    # THE BUILD GATE, and the whole of it. A failed or skipped `ci` skips this
    # job — the implicit success() in `if` sees to that.
    needs: ci
    if: github.repository_owner == 'mudbungie'
    permissions:
      # To push the `v<version>` tag and cut the GitHub Release. Restated here
      # because job-level permissions replace the workflow-level block.
      contents: write
      # The trusted-publishing grant: it lets this job ask GitHub for the signed
      # OIDC token release-plz trades for a short-lived registry token. Scoped
      # to this one job — no other job here can ask, and none needs to.
      id-token: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The BRANCH, not the run's pinned sha: release-plz resolves the
          # current branch through `@{upstream}`, which fails on a detached
          # HEAD. `ref_name` is `main` for both triggers.
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          # Publishing is authenticated by the OIDC grant above, not by a stored
          # registry secret. This token is for the tag and the GitHub Release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-release-pr:
    name: merge the release PR
    runs-on: ubuntu-latest
    # The gate, and the ordering, and the recursion stop, all in one list. The
    # bare `needs` carries an implicit success(), so a red `ci`, a failed PR
    # job or a failed release all skip this job; and `release-plz-pr` is
    # push-only, so the run this job dispatches skips it and skips this with
    # it. `ci` is named although `release-plz-release` already needs it —
    # the gate should be readable here, not inferred through another job.
    needs: [ci, release-plz-pr, release-plz-release]
    # Owner guard: never runs in a fork, like every other job here.
    if: github.repository_owner == 'mudbungie'
    timeout-minutes: 10
    permissions:
      # To merge, and to delete the merged head branch.
      contents: write
      # To read the open set and merge a pull request.
      pull-requests: write
      # To dispatch this workflow again after the merge. Without it the bump
      # lands on `main` and nothing publishes it.
      actions: write
    # Two runs finishing at once would otherwise race on one merge. Serialize;
    # the loser re-lists and finds the pull request already gone.
    concurrency:
      group: merge-release-pr
      cancel-in-progress: false
    steps:
      - name: Judge every open pull request, and merge a green release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # The commit `ci` passed in this run. Guard 5 tests the candidate
          # against it.
          GATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          prs="$(gh pr list --state open --limit 50 \
            --json number,headRefName,headRefOid,isDraft,mergeable,mergeStateStatus,author,files)"

          count="$(jq 'length' <<<"$prs")"
          echo "open pull requests: $count"
          if [ "$count" -eq 0 ]; then
            echo "nothing to judge"
            exit 0
          fi

          # One line per pull request: number, head sha, verdict, merge state.
          # Guards 1-4 are decided here so the shell below merges or reports and
          # never re-decides; guard 5 needs an API call and is below.
          verdicts="$(jq -r --arg owner "$OWNER" '
            def bump_files: ["Cargo.toml", "Cargo.lock"];
            .[] | [
              .number,
              .headRefOid,
              (if (.headRefName
                   | test("^release-plz-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$")
                   | not)
                 then "skip: head \(.headRefName) is not a release-plz branch"
               elif (.author.login != "app/github-actions" and .author.login != $owner)
                 then "skip: author \(.author.login) is neither the Actions bot nor the repository owner"
               elif .isDraft
                 then "skip: draft"
               elif ((.files | length) == 0)
                 then "skip: changes no files"
               elif (.files | map(select(.path as $p | bump_files | index($p) | not)) | length) > 0
                 then "skip: touches \(.files | map(.path) | join(" ")), which is not a version bump"
               elif (.mergeable != "MERGEABLE")
                 then "hold: GitHub says mergeable=\(.mergeable)"
               else "candidate" end),
              .mergeStateStatus
            ] | @tsv' <<<"$prs")"

          merged=0
          while IFS=$'\t' read -r number sha verdict state; do
            [ -n "$number" ] || continue
            if [ "$verdict" != "candidate" ]; then
              printf 'PR %s  %s  [merge state %s]\n' "$number" "$verdict" "$state"
              continue
            fi
            # Guard 5: the bump must sit on the commit this run gated. The
            # release PR's own checks never run here, so this identity — not a
            # check — is what ties the merge to a green tree.
            parent="$(gh api "repos/$GH_REPO/commits/$sha" -q '.parents[0].sha')"
            if [ "$parent" != "$GATED_SHA" ]; then
              printf 'PR %s  hold: head sits on %s, not the gated %s  [merge state %s]\n' \
                "$number" "${parent:0:8}" "${GATED_SHA:0:8}" "$state"
              continue
            fi
            printf 'PR %s  merging: version bump on the gated %s  [merge state %s]\n' \
              "$number" "${GATED_SHA:0:8}" "$state"
            gh pr merge "$number" --merge --delete-branch
            printf 'PR %s  merged\n' "$number"
            merged=$((merged + 1))
          done <<<"$verdicts"

          if [ "$merged" -eq 0 ]; then
            echo "merged nothing; no dispatch"
            exit 0
          fi

          # The merge was GITHUB_TOKEN's, so it created no workflow run at all.
          # This dispatch is the only thing that will publish the bump, and it
          # re-runs the whole gate on the merged tree before doing so.
          echo "dispatching release-plz.yml on main to publish the merged bump"
          gh workflow run release-plz.yml --ref main

  prune-release-branches:
    name: prune superseded release branches
    # Runs after the release-PR job RAN — succeeded or failed — and after
    # nothing else. `needs` alone would not do it: a bare `needs` carries an
    # implicit `success()`, so a FAILED PR job skips this one, and that is
    # exactly the path that strands a branch. release-plz pushes the timestamped
    # branch BEFORE it opens the PR, so the window in which a branch exists with
    # no PR is the window in which the PR step can still fail; the first armed
    # run failed there (the repository's create-PR setting was not yet enabled)
    # and left a branch nothing would ever collect.
    #
    # The condition names the two outcomes rather than saying `always()`,
    # because the other two results must still skip. A `workflow_dispatch` skips
    # the PR job by its own `github.event_name == 'push'` guard, and a fork
    # skips it by the owner guard: in both the branch was never pushed, so there
    # is nothing to collect and this job must stay skipped too. `!cancelled()`
    # is what drops the implicit `success()` — an `if` with no status function
    # keeps it, which is the trap this comment exists to hold shut.
    needs: release-plz-pr
    if: >-
      ${{ !cancelled()
      && (needs.release-plz-pr.result == 'success'
      || needs.release-plz-pr.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Because this job runs immediately after the PR job, the branch backing the
    # CURRENT release PR is already open — which makes "has no open PR" an exact
    # test for "superseded or orphaned" rather than an age heuristic. No
    # allowlist, no state to keep: the open-PR set is the single source of truth.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Delete every release-plz-* branch with no open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          open="$(gh pr list --state open --json headRefName -q '.[].headRefName')"
          git ls-remote --heads origin 'refs/heads/release-plz-*' |
            awk '{print $2}' | sed 's#refs/heads/##' |
            while read -r branch; do
              if grep -qxF "$branch" <<<"$open"; then
                echo "keep    $branch (backs an open PR)"
              else
                echo "delete  $branch"
                git push origin --delete "$branch"
              fi
            done
