name: CI

# **The gate, run by a machine rather than by whoever remembered** (bl-bbb3).
#
# `make ci` is `make check` and nothing here restates a step of it: fmt-check,
# then lint (line-cap, leak-scan, clippy, rules-audit, cargo deny), then the
# 100% coverage floor. A CI file that spelled out its own steps would be a
# second definition of green, and the two would drift within a week. The
# Makefile is the build authority; this file only readies a runner for it.
#
# `make image` and `make mac-artifact` are deliberately NOT here. Both need a
# container engine and neither is part of `check` — the gate must run on a box
# that has no engine at all. Attaching those artifacts to a release is its own
# ball and its own job; this one answers "is the tree green".
on:
  # Deliberately NO push arm. On a push to `main` this workflow still runs,
  # once, as the instance `release-plz.yml` CALLS inside its own run (`uses:
  # ./.github/workflows/ci.yml`, and its release job `needs:` that instance).
  # A push arm here would run the identical jobs a second time per push for
  # nothing. Consequence: this workflow has no runs of its own on `main`, so
  # anything reading them — a status badge, say — must read `release-plz.yml`.
  pull_request:
  # The reusable entry point, and its placement is load-bearing rather than a
  # convenience: crates.io trusted publishing REFUSES an OIDC token minted
  # under a `workflow_run` trigger, so a release gated by OBSERVING this
  # workflow from a distance would publish nothing, quietly, forever. A CALLED
  # workflow executes inside the CALLER's run, which keeps the release's OIDC
  # claim at trigger=push and workflow `release-plz.yml` — the identity the
  # registry is configured to trust — while the release job still hard-gates on
  # it through `needs:`.
  workflow_call:
  # The gate on a tree, by hand, without releasing anything.
  workflow_dispatch:

# CI reads the tree and writes nothing back. Every action is pinned to a full
# commit SHA with its tag in the trailing comment: a tag can be repointed at new
# code by its owner between two runs, a commit SHA cannot.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so leave no credential in .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          # The SHA pin erases the ref name this action reads the toolchain
          # from, so name it; rust-toolchain.toml still pins the build version.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The three pinned tools the gate shells to. Each is cached under its own
      # exact version, so a bump here is a cache miss rather than a stale
      # binary: the key IS the pin. All three pins have one home apiece and this
      # file is not it — tarpaulin.toml plus the Makefile preflight, deny.toml,
      # sgconfig.yml — so a bump moves in lockstep or the cache key stops
      # matching, which is the loud failure rather than the quiet one.
      - name: Cache cargo-tarpaulin 0.35.2
        id: tarpaulin-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-0.35.2-${{ runner.os }}
      - name: Install cargo-tarpaulin 0.35.2
        if: steps.tarpaulin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.35.2 --locked
      - name: Cache cargo-deny 0.20.2
        id: deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-deny 0.20.2
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Cache ast-grep 0.44.1
        id: astgrep-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/ast-grep
          key: ast-grep-0.44.1-${{ runner.os }}
      - name: Install ast-grep 0.44.1
        if: steps.astgrep-cache.outputs.cache-hit != 'true'
        run: cargo install ast-grep --version 0.44.1 --locked
      # The suite performs the operator's own out-of-channel mint by shelling to
      # `openssl` (src/test_support/mint.rs), which is the crate's one child
      # process outside the code under test. It wants real OpenSSL and not
      # LibreSSL — `x509 -copy_extensions` is OpenSSL-only — and the runner
      # image carries it. This is the line that says the dependency is
      # deliberate rather than incidental, and it fails HERE, in one named step,
      # rather than as an inscrutable test failure deep in the suite.
      - name: The one tool the suite shells to
        run: openssl version
      - run: make ci
      - name: Doctests
        run: cargo test --doc
